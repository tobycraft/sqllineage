name: codspeed

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit / branch / tag to clone and benchmark (defaults to the triggering ref)"
        required: false
        type: string

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      # sqllineage under test is checked out at the workspace root (rather
      # than the benchmark harness) so that its HEAD is what CodSpeed's
      # commit-hash detection picks up: the runner reports results against
      # the git commit found at the working directory of the benchmark
      # step, which defaults to the workspace root
      - name: Checkout sqllineage under test
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Checkout benchmark harness
        uses: actions/checkout@v6
        with:
          path: codspeed-harness
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # --no-install-project: only the third-party deps (sqlfluff,
        # networkx, pytest-codspeed, ...) come from the harness; the
        # sqllineage package itself is imported straight from the
        # workspace root via PYTHONPATH below, so the ref being
        # benchmarked can predate benchmarks/codspeed entirely
        run: uv sync --project codspeed-harness --extra codspeed --no-install-project
      - name: Run benchmark (CPU simulation)
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: PYTHONPATH=. uv run --project codspeed-harness --no-sync pytest codspeed-harness/benchmarks/codspeed --codspeed

  walltime:
    # requires CodSpeed Macro Runners: GitHub org account with CodSpeed
    # enabled for this repository (see https://codspeed.io/docs/features/macro-runners)
    runs-on: codspeed-macro
    steps:
      - name: Checkout sqllineage under test
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Checkout benchmark harness
        uses: actions/checkout@v6
        with:
          path: codspeed-harness
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --project codspeed-harness --extra codspeed --no-install-project
      - name: Run benchmark (walltime)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: PYTHONPATH=. uv run --project codspeed-harness --no-sync pytest codspeed-harness/benchmarks/codspeed --codspeed
